<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پایگاه حقیقت علمی</title>
    <!-- اتصال به کتابخانه‌های Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <style>
        /* استایل‌های پایه برای ظاهر اینستاگرامی */
        body { font-family: Tahoma, sans-serif; background: #fafafa; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .post-card { background: white; border: 1px solid #dbdbdb; margin-bottom: 20px; padding: 15px; }
        video { width: 100%; border-radius: 8px; }
        button { cursor: pointer; padding: 10px; background: #0095f6; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پایگاه حقیقت علمی</h1>
        <button id="connectWallet">اتصال کیف پول متامسک</button>
        <p id="userAddress">کاربر مهمان</p>
    </header>

    <!-- بخش آپلود ویدیو -->
    <section id="uploadSection" style="display:none;">
        <input type="file" id="videoFile" accept="video/*">
        <textarea id="caption" placeholder="کپشن علمی بنویسید..."></textarea>
        <button onclick="uploadVideo()">انتشار ویدیو</button>
    </section>

    <!-- نمایش ویدیوها -->
    <div id="feed"></div>
</div>

<script>
    // ۱. تنظیمات Firebase (از پنل فایربیس خود کپی کنید)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ۲. منطق اتصال متامسک (Web3)
    document.getElementById('connectWallet').addEventListener('click', async () => {
        if (window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            const address = accounts[0];
            document.getElementById('userAddress').innerText = "پروفایل: " + address;
            document.getElementById('uploadSection').style.display = 'block';
            // اینجا می‌توانید صفحه پروفایل کاربر را بر اساس address فیلتر کنید
        } else {
            alert("متامسک نصب نیست!");
        }
    });

    // ۳. تابع آپلود به Firebase
    async function uploadVideo() {
        const file = document.getElementById('videoFile').files[0];
        const caption = document.getElementById('caption').value;
        const storageRef = storage.ref('videos/' + file.name);
        
        await storageRef.put(file);
        const url = await storageRef.getDownloadURL();
        
        // ذخیره اطلاعات در دیتابیس
        await db.collection('posts').add({
            videoUrl: url,
            caption: caption,
            author: document.getElementById('userAddress').innerText,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("ویدیو با موفقیت منتشر شد!");
        location.reload();
    }

    // ۴. بارگذاری ویدیوها از دیتابیس
    db.collection('posts').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        snapshot.forEach(doc => {
            const post = doc.data();
            feed.innerHTML += `
                <div class="post-card">
                    <video src="${post.videoUrl}" controls></video>
                    <p><strong>${post.author}</strong>: ${post.caption}</p>
                </div>
            `;
        });
    });
</script>
</body>
</html>
